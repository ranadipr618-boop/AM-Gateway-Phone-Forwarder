name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name gradlew -type f | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          cp -a "$ROOT"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: am-sms-forwarder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
